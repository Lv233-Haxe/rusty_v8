name: build-v8js-reduced

# Builds slim V8 monolith static archives for v8js (Haxe/hxcpp binding):
#   - no ICU/i18n  (v8_enable_i18n_support=false)
#   - no WebAssembly (v8_enable_webassembly=false)
#   - no pointer compression / sandbox / custom libcxx (rusty_v8 defaults)
# Same pipeline as upstream ci.yml build-from-source jobs, archive lands at
#   target/<target>/release/gn_out/obj/{librusty_v8.a|rusty_v8.lib}

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-2022
            target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    env:
      V8_FROM_SOURCE: "1"
      GN_ARGS: "v8_enable_i18n_support=false v8_enable_webassembly=false"
      LIB_NAME: ${{ contains(matrix.target, 'windows') && 'rusty_v8' || 'librusty_v8' }}
      LIB_EXT: ${{ contains(matrix.target, 'windows') && 'lib' || 'a' }}

    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Download tools/win
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p tools/win
          curl -fL https://chromium.googlesource.com/chromium/src/tools/win/+archive/faefd1b6fa9eeb033ad6fe60368ccb9bf908cbd0.tar.gz |
            tar -xz -C tools/win

      - name: Install rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Install Windows ARM64 target
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install cross compilation toolchain (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          rustup target add aarch64-unknown-linux-gnu

          sudo apt update
          sudo apt install -yq --no-install-suggests --no-install-recommends \
            binfmt-support g++-10-aarch64-linux-gnu g++-10-multilib \
            gcc-10-aarch64-linux-gnu libc6-arm64-cross qemu qemu-user \
            qemu-user-binfmt

          sudo ln -sf /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 \
                     /lib/ld-linux-aarch64.so.1

          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc-10" >> ${GITHUB_ENV}
          echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> ${GITHUB_ENV}

      - name: Write git_submodule_status.txt
        shell: bash
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Build
        run: cargo build -v --locked --target ${{ matrix.target }} --release

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: librusty_v8-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }}
            target/${{ matrix.target }}/release/gn_out/src_binding.rs
          compression-level: 9
